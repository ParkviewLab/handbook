name: Deploy the site

# Publishes https://parkviewlab.github.io/<repo>/ from main, so the site shows the
# newest RELEASED documentation: the generated index, any hand-built pages under
# site/, and docs/ byte-identical under /docs/. Nothing generated is committed.
#
# The build step fails until the adopting repo writes its own
# scripts/build_pages_site.py to the contract in the handbook's docs-site.md (that
# script is per-repo: the index carries the repo's own styling). Two repository
# settings go with it, once each: the Pages source is the Actions workflow, and the
# github-pages environment's deployment branch policy allows main and nothing else.
# Both, and the tag rules the build must follow, are in docs-site.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight publish finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main             # always publish the released state, never develop
          fetch-depth: 0        # tags — the build reads the newest release from them

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build the site
        run: python3 scripts/build_pages_site.py --out "${{ runner.temp }}/site"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v5
