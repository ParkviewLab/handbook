
  docker:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # GHCR push
    steps:
      - uses: actions/checkout@v6

      - name: Install uv, to set the dev version in pyproject.toml
        if: hashFiles('pyproject.toml') != ''
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set the dev version in the workspace (nothing is committed)
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          if [ -f pyproject.toml ]; then
            uv version --no-sync "$VERSION"   # pyproject.toml and uv.lock together
          elif [ -f package.json ]; then
            npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
          fi

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (dev tags — NOT latest)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=raw,value=${{ needs.gate.outputs.version }}
            type=sha,prefix=sha-

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
