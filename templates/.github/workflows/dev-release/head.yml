name: Dev release

# Assembled from the ParkviewLab handbook's dev-release parts, one for each of
# this repository's publish targets that has a dev counterpart: the gate, then
# the dev job of each of those targets. The recipe is in the handbook's ci.md.
#
# A dev build is for local testing: a candidate CI builds before the release, not
# a version for others to use. Manually triggered on develop, by `git dev-release
# <patch|minor|major>`, which passes the kind as this workflow's `kind` input. It
# commits nothing: the gate computes the dev version from the newest release tag,
# the kind and the run, and each build job sets it in its own workspace. It
# creates NO `v*` tag, so the release gate is untouched, and runs no changelog
# job. See the handbook's releases.md ("What a release publishes", "Development
# versioning").

on:
  workflow_dispatch:
    inputs:
      kind:
        description: The release this build heads toward, counted from the newest release tag
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
