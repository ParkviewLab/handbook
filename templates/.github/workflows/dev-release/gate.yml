  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0        # the tags, to count the dev version from the newest release
      - name: Compute the dev version
        id: v
        env:
          KIND: ${{ inputs.kind }}
          RUN: ${{ github.run_number }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "dev-release runs from develop only (got $GITHUB_REF)"; exit 1
          fi
          # The repository's version file sets the dev marker's form.
          if [ -f pyproject.toml ]; then
            FILE=pyproject.toml; SEP=.dev
            CURRENT=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          elif [ -f package.json ]; then
            FILE=package.json; SEP=-dev
            CURRENT=$(jq -r .version package.json)
          elif [ -f VERSION.txt ]; then
            echo "::error::a repository whose version is in VERSION.txt has no dev build (handbook releases.md)"; exit 1
          else
            echo "no version file: expected pyproject.toml or package.json"; exit 1
          fi
          # The target: the newest vX.Y.Z tag, incremented by the kind as dev-tools'
          # _sot.sh sot_compute_next increments a plain version.
          TAG=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | awk 'NR==1' || true)
          if [ -n "$TAG" ]; then
            IFS=. read -r X Y Z <<< "${TAG#v}"
            case "$KIND" in
              patch) TARGET="$X.$Y.$((Z + 1))" ;;
              minor) TARGET="$X.$((Y + 1)).0" ;;
              major) TARGET="$((X + 1)).0.0" ;;
              *) echo "::error::kind '$KIND' is not patch, minor or major"; exit 1 ;;
            esac
          else
            # Before the first release there is nothing to count from: the target
            # is the version file's version, without its dev marker.
            TARGET=$(printf '%s\n' "$CURRENT" | sed -E 's/[.-]dev[0-9]*$//')
            echo "no release tag yet: the target is $FILE's $TARGET, and the kind is not used"
          fi
          # N from the run, so that each build, re-runs included, has its own
          # version: TestPyPI never accepts a file name twice.
          VERSION="$TARGET$SEP$((RUN * 100 + ATTEMPT))"
          echo "dev version: $VERSION (newest release: ${TAG:-none}; kind: $KIND)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
