
  # Installers for macOS, Windows and Linux, each built on its own system. The
  # part's contract is its artifacts: every leg uploads `installers-<os>`, and the
  # job that creates the GitHub Release attaches them to it. The steps below are
  # electron-builder's, the one installer build in use; another build may replace
  # them, keeping that contract. The macOS build is signed and notarized when the
  # Apple secrets are present, else unsigned.
  installers:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      # electron 43 ships no install script, so `npm ci` does not extract its prebuilt.
      # dist/ is otherwise filled lazily on first require, which `npm run legal` never
      # triggers (it reads dist/ from disk). Extract it now so dist/ and its Chromium
      # notices exist before `npm run legal`.
      - run: node node_modules/electron/install.js
      - run: npm run legal      # generate legal/ before electron-builder copies extraResources
      - run: npm run build
      - name: Prepare Apple API key (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "${{ secrets.APPLE_API_KEY_B64 }}" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      # electron-builder must be pinned to 26.16.1 or newer in package.json: earlier
      # versions pass the certificate password to `security set-key-partition-list`,
      # which wants the temporary keychain's own password, and current macos-latest
      # images reject it ("SecKeychainUnlock: … passphrase … not correct"). See the
      # handbook's electron-tooling.md -> "macOS signing needs electron-builder 26.16.1
      # or newer".
      - name: Package installers
        run: npx electron-builder --publish never
        env:
          # macOS is signed (Developer ID Application) + notarized (App Store Connect
          # API key); Windows/Linux stay unsigned. The signing creds must NOT reach the
          # Windows runner (it would try to sign with them), so each is scoped to macOS.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && 'true' || 'false' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          # APPLE_API_KEY (path to the .p8) is exported by the prep step above, macOS only.
      - uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
