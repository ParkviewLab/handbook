
  # Create the GitHub Release for the tag, with GitHub's generated notes. A
  # documents repository publishes no package, and the generated notes already
  # list every pull request merged since the previous tag with its link, so the
  # release has no changelog job. Idempotent: a re-run, or a Release already made
  # by hand, finds it and exits 0.
  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write   # scoped here — only this job creates the Release
    steps:
      - uses: actions/checkout@v6   # gh resolves the repo from the origin remote

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — nothing to do"
            exit 0
          fi
          if ! gh release create "$TAG" --title "$TAG" --verify-tag --generate-notes; then
            # a Release made by hand between the check and the create is fine
            gh release view "$TAG" >/dev/null 2>&1 && { echo "release $TAG appeared concurrently"; exit 0; }
            exit 1
          fi
