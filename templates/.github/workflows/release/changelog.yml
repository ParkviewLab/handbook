
  # Generate the Highlights paragraph + categorized list, commit the new
  # CHANGELOG.md section back to main, and create the GitHub Release. Runs
  # AFTER the target jobs so the Release page points at artifacts that already
  # exist. Two-phase invocation of dev-tools' generate-changelog keeps the LLM
  # call to a single round-trip even though the commit-back happens onto a
  # fresh main checkout.
  changelog:
    needs: [gate, TARGET_JOBS]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # scoped here — only this job commits CHANGELOG.md back to main
      pull-requests: read   # the merged pull requests the list is built from
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # every branch and tag: the rule searches them all
          # default ref = the tag, which is what we want for `--mode=generate`

      # The changelog script: dev-tools at a release pinned by its commit SHA,
      # the tag in the comment (the handbook's ci.md, "Shared dev scripts").
      - uses: actions/checkout@v6
        with:
          repository: ParkviewLab/dev-tools
          ref: 6337d278786b5ba9e0ed9d90e0a80bdd221b1e3e # v1.2.0
          path: dev-tools

      # Installers target only: omit this step where the release builds none.
      - name: Download all built installers
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Generate release-body.md (LLM call happens here)
        env:
          # Set at the ParkviewLab org level — inherited by every repo
          # under the org. Missing key → script writes a placeholder
          # paragraph and the release still ships.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # reads the merged pull requests
          GITHUB_REF: ${{ github.ref }}
        # `uv run --script` installs the exact anthropic SDK the script declares,
        # for just this invocation, without touching the project's dependencies.
        # --reuse-committed takes a section already on main, so a re-run after a
        # partial failure makes no second model call.
        run: uv run --script dev-tools/scripts/generate-changelog --mode=generate --reuse-committed

      - name: Switch to fresh origin/main and insert into CHANGELOG.md
        run: |
          # Stash the just-generated release body so it survives the checkout.
          cp release-body.md /tmp/release-body.md
          git fetch origin main
          git checkout origin/main
          mv /tmp/release-body.md release-body.md
          # Re-runs only the file-manipulation half, so it makes no model call.
          # `uv run --script` still installs the SDK the script declares, unused here.
          uv run --script dev-tools/scripts/generate-changelog --mode=insert

      - name: Commit CHANGELOG.md back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "no changelog change to commit"
            exit 0
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          # [skip ci] guards against any future non-tag-triggered workflows;
          # this release workflow only fires on `push: tags` so isn't at risk
          # of recursing, but the marker is cheap insurance.
          git commit -m "docs(changelog): $TAG [skip ci]"
          git push origin HEAD:main

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          shopt -s globstar nullglob
          files=()                                  # regular files only — the
          for f in artifacts/**/*; do               # per-OS dirs are not assets
            [[ -f "$f" ]] && files+=("$f")
          done
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-body.md \
            --target main \
            "${files[@]}"
